openapi: 3.1.0
info:
  contact:
    email: hello@nexovirt.com
    name: NexoVirt
  description: |
    A clean REST API over Proxmox VE, exposed by the NexoVirt panel at `/api/v1`.

    Use it to discover placement (nodes, storages, networks), discover provisioning
    inputs (plans, OS templates, CT templates, IP zones, SSH keys), create QEMU VMs and
    LXC containers, run lifecycle actions (power, reinstall, password reset, IP config,
    delete), and poll asynchronous jobs and live PVE tasks to completion, all without
    touching the web UI.

    ## Response envelope

    Every response is JSON shaped as `{ success, data, error }`. On success, `success` is
    `true`, `data` holds the payload, and `error` is `null`. On failure, `success` is
    `false`, `data` is `null`, and `error` is a human-readable message, alongside a
    matching HTTP status code (`400`, `401`, `403`, `404`, `409`, `422`, `502`).

    List endpoints that paginate add a `meta` object: `{ page, perPage, total }`. Request
    a page with `?page=<n>&perPage=<1..200>` (default `perPage` is 50, clamped to 200).

    ## Authentication

    Every request needs `Authorization: Bearer <token>`. Create tokens in the panel under
    Settings, API tokens. A token may be host-scoped (restricted to certain host ids),
    IP-allowlisted, and rate-limited. A scoped token gets `403 Forbidden` on any
    `/hosts/{id}/...` path it is not permitted to touch.

    ## Content type

    Send `Content-Type: application/json` for POST bodies. Form-encoded bodies also work.

    ## Async guest creation

    `POST /hosts/{id}/guests` enqueues a provisioning job and returns immediately with
    `{ queued: true, job_id, vmid }`. Poll `GET /hosts/{id}/jobs/{jobId}` until
    `data.status` reaches a terminal state, either `done` or `failed` (transitions through
    `queued` then `running`). On failure, `data.error` carries the reason. The same
    executor that backs the web wizard runs the actual PVE work.
  license:
    name: Proprietary
  title: NexoVirt REST API
  version: v1
servers:
- description: Your NexoVirt panel (admin token)
  url: "https://{host}/api/v1"
  variables:
    host:
      default: your-panel-host
      description: The hostname (and optional port) of your NexoVirt panel installation.
- description: "Your NexoVirt panel, reseller-scoped API (reseller token)"
  url: "https://{host}/api/reseller"
  variables:
    host:
      default: your-panel-host
      description: The hostname (and optional port) of your NexoVirt panel installation.
security:
- bearerAuth: []
tags:
- description: Configured Proxmox VE hosts and their live nodes.
  name: Hosts & nodes
- description: "DB-backed storage and network inventory, fast reads with no live PVE\
    \ call."
  name: Inventory
- description: "Everything a caller needs to learn before calling create, vmids, plans,\
    \ templates, IP zones, SSH keys."
  name: Provisioning discovery
- description: "List, inspect, create, and operate QEMU VMs and LXC containers."
  name: Guests
- description: Poll asynchronous provisioning jobs and live PVE tasks to completion.
  name: Jobs & tasks
- description: "Customer accounts, guest ownership, SSH keys and customer IP pools\
    \ (admin token required)."
  name: Users
- description: "Per-guest firewall rules and options, reconciled to PVE."
  name: Firewall
- description: Per-host NAT and port-forwarding.
  name: Networking
- description: Alert instances and alert rules.
  name: Alerts
- description: |
    Admin management of resellers, their assigned nodes/IP zones, and reseller quota plans. Requires an admin `/api/v1` bearer token. Enterprise-only, `403` otherwise.
  name: Resellers (admin)
- description: |
    A reseller's own customer accounts and their SSH keys, via the separate `/api/reseller` server and a reseller bearer token. Every endpoint is scoped to the calling reseller's own subtree; a cross-tenant id is a `404`, not a `403`.
  name: "Reseller: Customers"
- description: "Guest lifecycle (create, inspect, power, delete) over a reseller's\
    \ own subtree."
  name: "Reseller: Guests"
- description: "A reseller customer's SSH public keys (id/name/fingerprint only, never\
    \ the key body)."
  name: "Reseller: SSH keys"
- description: "Static IP changes for a reseller's own guests, within zones assigned\
    \ to them."
  name: "Reseller: Networking"
- description: Read-only plan availability and per-customer usage for the calling
    reseller.
  name: "Reseller: Plans & usage"
paths:
  /hosts:
    get:
      description: |
        Returns the panel's configured PVE hosts, scoped to the calling token's host_scope (an unscoped token sees all hosts). Never includes credentials.
      operationId: listHosts
      responses:
        "200":
          content:
            application/json:
              example:
                success: true
                error: null
                data:
                - id: 1
                  name: Test
                  hostname: 188.40.137.121
                  port: 8006
                  user: root@pam
                  active: true
              schema:
                $ref: "#/components/schemas/listHosts_200_response"
          description: Configured hosts.
        "401":
          $ref: "#/components/responses/Unauthorized"
      summary: List configured hosts
      tags:
      - Hosts & nodes
    post:
      description: Creates an encrypted host row; SSH agent onboarding stays a panel
        action. Never returns secrets.
      operationId: createHost
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createHost_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
          description: Created.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
      summary: Create a host
      tags:
      - Hosts & nodes
  /hosts/{hostId}/nodes:
    get:
      description: Live PVE node list for the given host (real-time call to Proxmox).
      operationId: listNodes
      parameters:
      - $ref: "#/components/parameters/HostId"
      responses:
        "200":
          content:
            application/json:
              example:
                success: true
                error: null
                data:
                - node: pve1
                  status: online
                  cpu: 0.03
                  maxcpu: 8
                  mem: 4294967296
                  maxmem: 34359738368
                  disk: 21474836480
                  maxdisk: 107374182400
                  uptime: 1234567
                  level: ""
              schema:
                $ref: "#/components/schemas/listNodes_200_response"
          description: Live node list.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
      summary: List a host's live nodes
      tags:
      - Hosts & nodes
  /hosts/{hostId}/nodes/{node}:
    get:
      description: |
        Live PVE node status for a single node (CPU info, memory, root filesystem, load average, PVE version, and so on). The response passes through Proxmox's own node status object.
      operationId: getNode
      parameters:
      - $ref: "#/components/parameters/HostId"
      - $ref: "#/components/parameters/NodeName"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/getNode_200_response"
          description: Live node status.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          $ref: "#/components/responses/BadGateway"
      summary: Get live node detail
      tags:
      - Hosts & nodes
  /hosts/{hostId}/nodes/{node}/usage:
    get:
      description: |
        Chart-ready time series built from the DB-backed node metrics table, not a live PVE call. Points are `[epoch_ms, value]` pairs.
      operationId: getNodeUsage
      parameters:
      - $ref: "#/components/parameters/HostId"
      - $ref: "#/components/parameters/NodeName"
      - $ref: "#/components/parameters/Range"
      - $ref: "#/components/parameters/Metrics"
      responses:
        "200":
          content:
            application/json:
              example:
                success: true
                error: null
                data:
                  range: 30m
                  series:
                  - name: cpu
                    unit: '%'
                    points:
                    - - 1752480000000
                      - 3.2
                    - - 1752480030000
                      - 4.1
                  - name: mem
                    unit: '%'
                    points:
                    - - 1752480000000
                      - 41.7
                    - - 1752480030000
                      - 42.0
              schema:
                $ref: "#/components/schemas/getNodeUsage_200_response"
          description: Node usage series.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
      summary: Node CPU/mem/disk/net time series
      tags:
      - Hosts & nodes
  /hosts/{hostId}/usage/summary:
    get:
      description: |
        Guests up/down/total and summed cores/memory/disk across the host's latest inventory snapshot, DB-backed, no live PVE call.
      operationId: getUsageSummary
      parameters:
      - $ref: "#/components/parameters/HostId"
      responses:
        "200":
          content:
            application/json:
              example:
                success: true
                error: null
                data:
                  guests:
                    up: 7
                    down: 2
                    total: 9
                  cores: 24
                  mem: 68719476736
                  disk: 900000000000
              schema:
                $ref: "#/components/schemas/getUsageSummary_200_response"
          description: Usage summary.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Host usage summary
      tags:
      - Hosts & nodes
  /hosts/{hostId}/storages:
    get:
      description: |
        Node storages from the latest inventory snapshot (DB-backed, no live PVE read). With `?node=`, returns that node's storages plus any datacenter-wide/shared entries (a row with an empty node, for example shared NFS or PBS storage, matches every node). Paginated. Filter by `content` client-side, for example `images` for VM disks or `rootdir` for LXC.
      operationId: listStorages
      parameters:
      - $ref: "#/components/parameters/HostId"
      - $ref: "#/components/parameters/NodeQuery"
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          content:
            application/json:
              example:
                success: true
                error: null
                data:
                - id: local-lvm
                  node: pve1
                  type: lvmthin
                  total: 500000000000
                  used: 120000000000
                  avail: 380000000000
                  used_pct: 24.0
                  content: "images,rootdir"
                  active: true
                meta:
                  page: 1
                  perPage: 50
                  total: 3
              schema:
                $ref: "#/components/schemas/listStorages_200_response"
          description: Storages.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: List storages
      tags:
      - Inventory
  /hosts/{hostId}/networks:
    get:
      description: |
        Node network interfaces from the latest inventory snapshot (DB-backed, no live PVE read), enriched with bridge classification. `role` is one of `WAN`, `Private`, `Internal`, or `Other`. Paginated.
      operationId: listNetworks
      parameters:
      - $ref: "#/components/parameters/HostId"
      - $ref: "#/components/parameters/NodeQuery"
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          content:
            application/json:
              example:
                success: true
                error: null
                data:
                - iface: vmbr0
                  node: pve1
                  type: bridge
                  role: WAN
                  cidr: 203.0.113.0/24
                  gateway: 203.0.113.1
                  ports: eno1
                  active: true
                meta:
                  page: 1
                  perPage: 50
                  total: 2
              schema:
                $ref: "#/components/schemas/listNetworks_200_response"
          description: Network interfaces.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: List network interfaces
      tags:
      - Inventory
  /hosts/{hostId}/next-vmid:
    get:
      description: |
        A free VMID from the live PVE `cluster/nextid` call. Create still requires an explicit `vmid` in the body; use this to obtain one.
      operationId: getNextVmid
      parameters:
      - $ref: "#/components/parameters/HostId"
      responses:
        "200":
          content:
            application/json:
              example:
                success: true
                error: null
                data:
                  next_vmid: 105
              schema:
                $ref: "#/components/schemas/getNextVmid_200_response"
          description: Next free VMID.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/BadGateway"
      summary: Get the next free VMID
      tags:
      - Provisioning discovery
  /hosts/{hostId}/plans:
    get:
      description: |
        Active resource plans usable as `plan_id` at create time. A plan fills and locks `cores`, `memory_mb`, and `disk_gb` on the created guest. Paginated.
      operationId: listPlans
      parameters:
      - $ref: "#/components/parameters/HostId"
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          content:
            application/json:
              example:
                success: true
                error: null
                data:
                - id: 2
                  name: Standard
                  description: "2 vCPU, 2 GB RAM, 20 GB disk"
                  cores: 2
                  memory_mb: 2048
                  disk_gb: 20
                  traffic_limit_gb: 1000
                  runtime_days: 30
                  grace_days: 3
                  snapshot_limit: 3
                meta:
                  page: 1
                  perPage: 50
                  total: 4
              schema:
                $ref: "#/components/schemas/listPlans_200_response"
          description: Resource plans.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: List resource plans
      tags:
      - Provisioning discovery
  /hosts/{hostId}/os-templates:
    get:
      description: |
        Cloud-init OS templates for QEMU. `ref` (for example `tpl:7`) is the exact `os_template` value to send at create. Never returns SSH keys or other cloud-init secrets. Paginated.
      operationId: listOsTemplates
      parameters:
      - $ref: "#/components/parameters/HostId"
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          content:
            application/json:
              example:
                success: true
                error: null
                data:
                - id: 7
                  ref: tpl:7
                  name: Ubuntu 24.04
                  description: Ubuntu 24.04 LTS cloud image
                  ostype: l26
                  ci_user: ubuntu
                  group_id: 1
                  group_name: General
                  is_shipped: true
                meta:
                  page: 1
                  perPage: 50
                  total: 6
              schema:
                $ref: "#/components/schemas/listOsTemplates_200_response"
          description: QEMU OS templates.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: List QEMU OS templates
      tags:
      - Provisioning discovery
  /hosts/{hostId}/ct-templates:
    get:
      description: |
        LXC template options. `managed` is the panel's own CT template library (`lxc_template_id` is the create argument, staged on demand). `available` is live PVE `vztmpl` volumes on `?node` (only populated when a valid `node` is given; `volid` is the create argument). Without `?node`, `available` is an empty array and no PVE call is made. Not paginated.
      operationId: listCtTemplates
      parameters:
      - $ref: "#/components/parameters/HostId"
      - $ref: "#/components/parameters/NodeQuery"
      responses:
        "200":
          content:
            application/json:
              example:
                success: true
                error: null
                data:
                  managed:
                  - lxc_template_id: 3
                    name: Debian 12
                    description: Debian 12 bookworm
                    ostype: debian
                    arch: amd64
                    unprivileged: true
                    group_id: 1
                    source: shipped
                  available:
                  - volid: local:vztmpl/debian-12-standard_12.7-1_amd64.tar.zst
                    node: pve1
                    format: tar.zst
                    size: 134217728
              schema:
                $ref: "#/components/schemas/listCtTemplates_200_response"
          description: Managed and available LXC templates.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
      summary: List LXC container templates
      tags:
      - Provisioning discovery
  /hosts/{hostId}/ip-zones:
    get:
      description: |
        The host's IP zones (IPAM). `ref` (for example `zone:3`) is the exact `ip_source` create value; using it allocates a static IP from the zone's pool. Paginated.
      operationId: listIpZones
      parameters:
      - $ref: "#/components/parameters/HostId"
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          content:
            application/json:
              example:
                success: true
                error: null
                data:
                - id: 3
                  ref: zone:3
                  name: Private LAN
                  family: ipv4
                  bridge: vmbr1
                  cidr: 10.10.0.0/24
                  gateway: 10.10.0.1
                  vlan: ""
                  is_active: true
                meta:
                  page: 1
                  perPage: 50
                  total: 1
              schema:
                $ref: "#/components/schemas/listIpZones_200_response"
          description: IP zones.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: List IP zones
      tags:
      - Provisioning discovery
  /users/{userId}/ssh-keys:
    get:
      description: |
        A user's stored SSH keys, exposing only `id`, `name`, and `fingerprint`, never the key body. Pass the owner's id as `owner_id` at create to auto-inject all of that user's stored keys. Not paginated.
      operationId: listUserSshKeys
      parameters:
      - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          content:
            application/json:
              example:
                success: true
                error: null
                data:
                - id: 5
                  name: laptop
                  fingerprint: SHA256:9f0b6c...
              schema:
                $ref: "#/components/schemas/listUserSshKeys_200_response"
          description: SSH keys.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      summary: List a user's SSH keys
      tags:
      - Provisioning discovery
    post:
      description: "Validates, fingerprints and stores the key (deduped per user).\
        \ Returns id/name/fingerprint only, never the key body."
      operationId: addUserSshKey
      parameters:
      - $ref: "#/components/parameters/UserId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/addUserSshKey_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
          description: Added.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
      summary: Add an SSH key to a user
      tags:
      - Users
  /hosts/{hostId}/guests:
    get:
      description: |
        Guest list from the latest inventory snapshot (DB-backed, no live PVE call), filterable by `node`, `type`, and `status`. Paginated.
      operationId: listGuests
      parameters:
      - $ref: "#/components/parameters/HostId"
      - $ref: "#/components/parameters/NodeQuery"
      - description: Filter by guest type.
        explode: true
        in: query
        name: type
        required: false
        schema:
          enum:
          - qemu
          - lxc
          type: string
        style: form
      - description: "Filter by guest status, for example running or stopped."
        explode: true
        in: query
        name: status
        required: false
        schema:
          type: string
        style: form
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          content:
            application/json:
              example:
                success: true
                error: null
                data:
                - host_id: 1
                  host: Test
                  node: pve1
                  vmid: 105
                  name: web-01
                  type: qemu
                  status: running
                  os: l26
                  ip: 10.10.0.5
                  cores: 2
                  mem: 2147483648
                  storage: 21474836480
                  qemu_agent: true
                meta:
                  page: 1
                  perPage: 50
                  total: 9
              schema:
                $ref: "#/components/schemas/listGuests_200_response"
          description: Guests.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: List guests
      tags:
      - Guests
    post:
      description: |
        Creates a QEMU VM or an LXC container. Creation is asynchronous: this call validates the request, enqueues a provisioning job, and returns immediately with `{ queued: true, job_id, vmid }`. Poll `GET /hosts/{hostId}/jobs/{jobId}` until `data.status` is `done` or `failed`. The same executor that backs the web wizard runs the actual PVE work, so the guest's plan, template, IP source, and disks are applied exactly as they would be from the panel.

        A plan (`plan_id`) fills and locks `cores`, `memory_mb`, and `disk_gb`; otherwise supply them explicitly (defaults 1 core, 512 MB, 8 GB). `password` is required unless at least one SSH key is present (via `ssh_keys[]` or an `owner_id` with stored keys). QEMU requires `os_template` as `tpl:<id>` from `GET /hosts/{hostId}/os-templates`. LXC requires exactly one template source, either `lxc_template_id` (from the `managed` list) or `os_template` as a raw volid (from the `available` list). `ip_source` is `dhcp` (default) or `zone:<id>` (from `GET /hosts/{hostId}/ip-zones`) to allocate a static IP. `extra_storage[]`, `extra_size[]`, and `extra_mount[]` are parallel arrays describing additional disks; LXC mounts must be absolute paths and default to `/mnt/disk<N>` when blank.
      operationId: createGuest
      parameters:
      - $ref: "#/components/parameters/HostId"
      requestBody:
        content:
          application/json:
            examples:
              qemuFromPlan:
                summary: "QEMU VM from a plan, DHCP"
                value:
                  type: qemu
                  node: pve1
                  vmid: 105
                  name: web-01
                  plan_id: 2
                  storage: local-lvm
                  bridge: vmbr0
                  os_template: tpl:7
                  ip_source: dhcp
                  password: s3cret-pw
              lxcCustomWithZoneIp:
                summary: LXC container with explicit specs and a static IP
                value:
                  type: lxc
                  node: pve1
                  vmid: 106
                  name: db-01
                  cores: 2
                  memory_mb: 2048
                  disk_gb: 20
                  storage: local-lvm
                  bridge: vmbr1
                  lxc_template_id: 3
                  ip_source: zone:3
                  password: s3cret-pw
                  owner_id: 4
                  extra_storage:
                  - local-lvm
                  extra_size:
                  - 50
                  extra_mount:
                  - /data
              lxcDocker:
                summary: LXC container ready for Docker (unprivileged + nesting +
                  keyctl)
                value:
                  type: lxc
                  node: pve1
                  vmid: 107
                  name: docker-01
                  cores: 2
                  memory_mb: 2048
                  disk_gb: 20
                  storage: local-lvm
                  bridge: vmbr0
                  lxc_template_id: 3
                  password: s3cret-pw
                  unprivileged: true
                  nesting: true
                  keyctl: true
            schema:
              $ref: "#/components/schemas/GuestCreateRequest"
        required: true
      responses:
