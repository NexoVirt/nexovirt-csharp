  /guests/{hostId}/{type}/{vmid}/ip:
    post:
      description: |
        `action=change` requires `ip` (must fall inside the target zone's range) and assigns it; `action=release` frees the guest's current IP for that family. The target zone (`zone_id`, or the guest's current single-stack zone if omitted) must be one the calling reseller was granted. Reboot the guest to apply.
      operationId: changeResellerGuestIp
      parameters:
      - $ref: "#/components/parameters/HostId"
      - $ref: "#/components/parameters/GuestType"
      - $ref: "#/components/parameters/Vmid"
      requestBody:
        content:
          application/json:
            example:
              node: pve1
              action: change
              zone_id: 3
              ip: 203.0.113.42
            schema:
              $ref: "#/components/schemas/changeResellerGuestIp_request"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
          description: Applied.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "502":
          $ref: "#/components/responses/BadGateway"
      security:
      - resellerBearerAuth: []
      summary: Change or release a guest's static IP
      tags:
      - "Reseller: Networking"
    servers:
    - url: "https://{host}/api/reseller"
      variables:
        host:
          default: your-panel-host
  /plans:
    get:
      description: The reseller's own plans plus any global plans. Read-only.
      operationId: listResellerPlansAvailable
      parameters:
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/PerPage"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Envelope"
          description: Plans.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      security:
      - resellerBearerAuth: []
      summary: List plans available to me
      tags:
      - "Reseller: Plans & usage"
    servers:
    - url: "https://{host}/api/reseller"
      variables:
        host:
          default: your-panel-host
  /usage:
    get:
      description: Per-customer usage breakdown plus the reseller's total usage and
        quota plan. Read-only.
      operationId: getResellerUsage
      responses:
        "200":
          content:
            application/json:
              example:
                success: true
                error: null
                data:
                  customers:
                  - id: 4
                    username: bob
                    guests: 3
                    cores: 6
                    memory_mb: 8192
                    disk_gb: 120
                  usage:
                    customers: 12
                    guests: 34
                    cores: 40
                    memory_mb: 65536
                    disk_gb: 800
                  plan:
                    id: 2
                    name: Standard
                    max_customers: 20
                    max_guests: 60
                    max_cores: 80
                    max_memory_mb: 131072
                    max_disk_gb: 2000
              schema:
                $ref: "#/components/schemas/Envelope"
          description: Usage.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      security:
      - resellerBearerAuth: []
      summary: My usage
      tags:
      - "Reseller: Plans & usage"
    servers:
    - url: "https://{host}/api/reseller"
      variables:
        host:
          default: your-panel-host
components:
  parameters:
    HostId:
      description: The panel's internal host id (from `GET /hosts`).
      explode: false
      in: path
      name: hostId
      required: true
      schema:
        type: integer
      style: simple
    UserId:
      explode: false
      in: path
      name: userId
      required: true
      schema:
        type: integer
      style: simple
    NodeName:
      description: The PVE node name.
      explode: false
      in: path
      name: node
      required: true
      schema:
        type: string
      style: simple
    ResellerId:
      description: The panel's internal user id of a `role=reseller` account.
      explode: false
      in: path
      name: resellerId
      required: true
      schema:
        type: integer
      style: simple
    ResellerPlanId:
      description: A reseller quota-plan id.
      explode: false
      in: path
      name: planId
      required: true
      schema:
        type: integer
      style: simple
    CustomerId:
      description: The panel's internal user id of one of the calling reseller's own
        customers.
      explode: false
      in: path
      name: customerId
      required: true
      schema:
        type: integer
      style: simple
    SshKeyId:
      description: An SSH key id belonging to the given customer.
      explode: false
      in: path
      name: keyId
      required: true
      schema:
        type: integer
      style: simple
    NodeQuery:
      description: Restrict results to this PVE node (plus any datacenter-wide/shared
        entries).
      explode: true
      in: query
      name: node
      required: false
      schema:
        type: string
      style: form
    GuestType:
      description: Guest type.
      explode: false
      in: path
      name: type
      required: true
      schema:
        enum:
        - qemu
        - lxc
        type: string
      style: simple
    Vmid:
      description: The guest's VMID.
      explode: false
      in: path
      name: vmid
      required: true
      schema:
        type: integer
      style: simple
    Page:
      description: "Page number, 1-based."
      explode: true
      in: query
      name: page
      required: false
      schema:
        default: 1
        minimum: 1
        type: integer
      style: form
    PerPage:
      description: "Items per page, clamped to 1..200."
      explode: true
      in: query
      name: perPage
      required: false
      schema:
        default: 50
        maximum: 200
        minimum: 1
        type: integer
      style: form
    Range:
      description: Time window for the series.
      explode: true
      in: query
      name: range
      required: false
      schema:
        default: 30m
        enum:
        - 30m
        - 3h
        - 24h
        type: string
      style: form
    Metrics:
      description: "Comma-separated subset of metrics to return, for example \"cpu,mem\"\
        . Defaults to all."
      explode: true
      in: query
      name: metrics
      required: false
      schema:
        type: string
      style: form
  responses:
    Unauthorized:
      content:
        application/json:
          example:
            success: false
            data: null
            error: Invalid or missing API token.
          schema:
            $ref: "#/components/schemas/Envelope"
      description: Missing or invalid bearer token.
    Forbidden:
      content:
        application/json:
          example:
            success: false
            data: null
            error: This token is not permitted to access this host.
          schema:
            $ref: "#/components/schemas/Envelope"
      description: "The token is not scoped to this host, or its IP allowlist rejected\
        \ the caller."
    NotFound:
      content:
        application/json:
          example:
            success: false
            data: null
            error: Host not found.
          schema:
            $ref: "#/components/schemas/Envelope"
      description: "The host, guest, user, or job was not found."
    ValidationError:
      content:
        application/json:
          example:
            success: false
            data: null
            error: Invalid node name.
          schema:
            $ref: "#/components/schemas/Envelope"
      description: "The request failed validation, for example an invalid node name\
        \ or missing field."
    BadGateway:
      content:
        application/json:
          example:
            success: false
            data: null
            error: Could not reach the host.
          schema:
            $ref: "#/components/schemas/Envelope"
      description: The underlying Proxmox VE call failed or the host was unreachable.
  schemas:
    Envelope:
      example:
        data: ""
        success: true
        meta:
          total: 137
          perPage: 50
          page: 1
        error: error
      properties:
        success:
          type: boolean
        data: {}
        error:
          description: "A human-readable error message, null on success."
          nullable: true
          type: string
        meta:
          $ref: "#/components/schemas/PaginationMeta"
      required:
      - data
      - error
      - success
    PaginationMeta:
      example:
        total: 137
        perPage: 50
        page: 1
