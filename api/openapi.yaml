  securitySchemes:
    bearerAuth:
      description: |
        A NexoVirt API token, created in the panel under Settings, API tokens. Send it as `Authorization: Bearer <token>`.
      scheme: bearer
      type: http
    resellerBearerAuth:
      description: |
        A reseller API token, issued in the reseller portal under API tokens (separate from the admin `/api/v1` bearerAuth tokens above). Send it as `Authorization: Bearer <token>` against the `/api/reseller` server. Every endpoint is scoped to the calling reseller's own customers, guests, nodes, and IP zones; an id outside that subtree returns `404`, not `403`, so cross-tenant existence is never leaked.
      scheme: bearer
      type: http

