          example: l26
          type: string
    GuestCreateRequest:
      description: |
        Common fields apply to both types. QEMU additionally requires `os_template`. LXC requires exactly one of `lxc_template_id` or `os_template`. `password` is required unless at least one SSH key is present, either via `ssh_keys[]` or an `owner_id` with stored keys.
      example:
        lxc_template_id: 2
        keyctl: true
        extra_size:
        - 2
        - 2
        bios: seabios
        owner_id: 7
        firewall_presets:
        - 3
        - 3
        storage: storage
        type: qemu
        snapshot_limit: 9
        fuse: true
        vga: std
        password: password
        cores: 1
        extra_mount:
        - extra_mount
        - extra_mount
        nesting: true
        disk_gb: 5
        vmid: 0
        ip_source: dhcp
        cpu: kvm64
        mount: mount
        node: node
        os_template: os_template
        ssh_keys:
        - ssh_keys
        - ssh_keys
        unprivileged: true
        extra_storage:
        - extra_storage
        - extra_storage
        machine: i440fx
        name: name
        memory_mb: 5
        bridge: vmbr0
        plan_id: 6
      properties:
        type:
          enum:
          - qemu
          - lxc
          type: string
        node:
          description: Target PVE node name.
          type: string
        vmid:
          description: "A positive, free VMID. Get one from GET /hosts/{hostId}/next-vmid."
          type: integer
        name:
          description: Guest name/hostname. Defaults to vm-<vmid> or ct-<vmid>.
          type: string
        plan_id:
          description: "A plan id from GET /hosts/{hostId}/plans. Fills and locks\
            \ cores/memory_mb/disk_gb."
          type: integer
        cores:
          default: 1
          description: Explicit spec when no plan_id is given.
          type: integer
        memory_mb:
          default: 512
          description: Explicit spec when no plan_id is given.
          type: integer
        disk_gb:
          default: 8
          description: Explicit spec when no plan_id is given.
          type: integer
        storage:
          description: "Storage id for the root disk, from GET /hosts/{hostId}/storages."
          type: string
        bridge:
          default: vmbr0
          description: "Network bridge, from GET /hosts/{hostId}/networks."
          type: string
        os_template:
          description: |
            Required for QEMU as tpl:<id> from GET /hosts/{hostId}/os-templates. For LXC, an alternative to lxc_template_id, a raw vztmpl volid from GET /hosts/{hostId}/ct-templates.
          type: string
        lxc_template_id:
          description: "LXC only, a managed CT template id from GET /hosts/{hostId}/ct-templates."
          type: integer
        ip_source:
          default: dhcp
          description: "dhcp (default) or zone:<id> from GET /hosts/{hostId}/ip-zones\
            \ to allocate a static IP."
          type: string
        password:
          description: Root password. Required unless an SSH key is present.
          minLength: 5
          type: string
        ssh_keys:
          description: "Public key bodies, merged with the owner's stored keys."
          items:
            type: string
          type: array
        owner_id:
          description: Assigns ownership. The owner's stored SSH keys are auto-injected.
          type: integer
        snapshot_limit:
          description: Max snapshots for this guest.
          type: integer
        firewall_presets:
          description: Firewall preset ids to apply.
          items:
            type: integer
          type: array
        extra_storage:
          description: "Parallel array with extra_size/extra_mount, additional disk\
            \ storage ids."
          items:
            type: string
          type: array
        extra_size:
          description: "Parallel array with extra_storage/extra_mount, additional\
            \ disk sizes in GB."
          items:
            type: integer
          type: array
        extra_mount:
          description: |
            Parallel array with extra_storage/extra_size, LXC-only mount paths. Must be absolute paths; blank defaults to /mnt/disk<N>.
          items:
            type: string
          type: array
        unprivileged:
          description: |
            LXC only. Create an unprivileged container. Omitted keeps PVE's default (privileged). For Docker in an unprivileged container also set nesting + keyctl.
          type: boolean
        nesting:
          description: LXC only. Adds nesting=1 to the container features (run Docker
            / systemd / nested containers).
          type: boolean
        keyctl:
          description: LXC only. Adds keyctl=1 (required for Docker inside an unprivileged
            container).
          type: boolean
        fuse:
          description: LXC only. Adds fuse=1 (allow FUSE mounts inside the container).
          type: boolean
        mount:
          description: "LXC only. Comma/semicolon list of mount types to allow (allow-listed:\
            \ nfs, cifs). Invalid types return 422."
          type: string
        bios:
          description: QEMU only. Firmware. ovmf (UEFI) also allocates an EFI disk
            on the chosen storage. Unrecognised values are ignored.
          enum:
          - seabios
          - ovmf
          type: string
        machine:
          description: QEMU only. Machine type. Unrecognised values are ignored.
          enum:
          - i440fx
          - q35
          type: string
        cpu:
          description: QEMU only. CPU type. Unrecognised values are ignored.
          enum:
          - kvm64
          - host
          - qemu64
          - x86-64-v2
          - x86-64-v2-AES
          - x86-64-v3
          - x86-64-v4
          type: string
        vga:
          description: QEMU only. Display adapter. Unrecognised values are ignored.
          enum:
          - std
          - qxl
          - virtio
          - vmware
          - cirrus
          - serial0
          - none
